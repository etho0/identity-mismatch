<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origin A — Stream Holder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;padding:14px;font-size:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;max-width:600px;margin:0 auto 12px}
h2{font-size:16px;color:#58a6ff;margin-bottom:4px}
.sub{font-size:11px;color:#8b949e;line-height:1.5;margin-bottom:12px}
.state{border-radius:8px;padding:12px;margin:10px 0;font-weight:650;text-align:center;font-size:13px}
.on{background:#0f5323;color:#7ee787}.off{background:#2d1214;color:#ff7b72}
button{width:100%;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;color:#fff;background:#238636;margin-top:8px}
button.stop{background:#da3633}button.alt{background:#30363d}
.row{display:flex;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid #21262d}
.row b{min-width:150px;color:#8b949e;font-weight:500}
.row span{font-family:ui-monospace,monospace;word-break:break-all}
video{width:100%;max-height:170px;border-radius:8px;background:#000;margin-top:8px;display:none}
code{background:#21262d;padding:2px 5px;border-radius:4px;font-size:.85em}
</style>
</head>
<body>
<div class="card">
  <h2>Origin A — Stream Holder</h2>
  <p class="sub">Acquires and <b>holds</b> a media stream so the prober (Origin B, in another tab or
  another origin) can be tested against a live capture. Keep this tab open while probing.
  <br><br>Origin: <code id="org"></code></p>
  <div class="state off" id="state">no stream held</div>
  <button onclick="hold('camera')">Hold CAMERA + MIC (getUserMedia)</button>
  <button onclick="hold('screen')">Hold SCREEN (getDisplayMedia)</button>
  <button class="stop" onclick="release()">Release all streams</button>
  <button class="alt" onclick="announce()">Announce state on BroadcastChannel</button>
  <video id="v" autoplay playsinline muted></video>
  <div id="info"></div>
</div>
<script>
document.getElementById('org').textContent = location.origin;
let held = [];
const bc = (()=>{ try { return new BroadcastChannel('media-state'); } catch(e){ return null; } })();

function row(k,v){ const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<b>${k}</b><span>${v}</span>`; document.getElementById('info').appendChild(d); }

async function hold(kind){
  try{
    const s = kind === 'screen'
      ? await navigator.mediaDevices.getDisplayMedia({video:true, audio:false})
      : await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    held.push(s);
    const v = document.getElementById('v'); v.srcObject = s; v.style.display='block';
    const st = document.getElementById('state');
    st.className='state on';
    st.textContent = `HOLDING ${kind.toUpperCase()} — ${s.getTracks().map(t=>t.kind).join('+')}`;
    document.getElementById('info').innerHTML='';
    row('origin', location.origin);
    row('kind', kind);
    s.getTracks().forEach(t => row(`track ${t.kind}`, `${t.label || '(no label)'} | state=${t.readyState}`));
    // does a track survive being structured-cloned / transferred?
    row('track transferable?', (()=>{ try { const t=s.getVideoTracks()[0];
      structuredClone(t, {transfer:[t]}); return 'YES — MediaStreamTrack is transferable here'; }
      catch(e){ return 'no — ' + e.name; } })());
    announce();
  }catch(e){
    document.getElementById('state').className='state off';
    document.getElementById('state').textContent = `failed: ${e.name} — ${e.message}`;
  }
}
function release(){
  held.forEach(s => s.getTracks().forEach(t => t.stop()));
  held = [];
  document.getElementById('v').style.display='none';
  const st = document.getElementById('state'); st.className='state off'; st.textContent='no stream held';
  announce();
}
function announce(){
  const payload = { origin: location.origin, holding: held.length > 0,
                    kinds: held.flatMap(s=>s.getTracks().map(t=>t.kind)), ts: Date.now() };
  try { bc && bc.postMessage(payload); } catch(e){}
  try { localStorage.setItem('media_state', JSON.stringify(payload)); } catch(e){}
}
</script>
</body>
</html>
